services:
  - type: web
    name: chatparva-mela
    runtime: node
    plan: free
    region: singapore # Closest server region to Nepal (low latency < 50ms)
    buildCommand: npm install && npm run build
    startCommand: npm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: "*"

